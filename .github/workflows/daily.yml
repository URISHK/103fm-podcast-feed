name: Update Podcast Feed

on:
  schedule:
    # Sunday-Thursday at 10:00 UTC (13:00 IL summer / 12:00 IL winter).
    # This is the GitHub-side cron. A Cloudflare Worker also triggers at the
    # same time as backup — see podcast-workflow-trigger Worker.
    - cron: '0 10 * * 0-4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass monthly safety cap (only use if legitimately hit the cap)'
        type: boolean
        default: false

permissions:
  contents: write

# Only one instance of this workflow may run at a time. If a second run is
# triggered while one is in progress (e.g. GitHub cron + Cloudflare Worker
# firing near-simultaneously), the new run waits. If a THIRD queues while the
# second is still waiting, the second gets superseded by the third — so at
# most 2 runs ever happen: the currently-running one, and the latest queued.
# Prevents git-push races.
concurrency:
  group: podcast-feed-update
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    # Normal runs take 15-30 seconds. 10 minutes leaves generous headroom for
    # network hiccups on 103FM's side, but fails fast if anything truly hangs —
    # rather than blocking future queued runs for the default 6-hour limit.
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Enough history for the scraper's monthly commit-cap check (~30-60
          # commits/month worst case). Faster than fetch-depth: 0 (full history).
          fetch-depth: 100

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        env:
          FORCE_RUN: ${{ inputs.force }}
        run: python scrape.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add -A
            git commit -m "Update feed $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes to commit"
          fi
